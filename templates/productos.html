{% extends "base.html" %}
{% block contenido %}
<section class="tarjeta">
  <div class="fila">
    <h1>Inventario</h1>
    <a class="boton" href="{{ url_for('nuevo_producto') }}">+ Nuevo producto</a>
  </div>
  <form method="get" class="buscar">
    <input name="q" value="{{ q }}" placeholder="Buscar por nombre">
    <button type="submit">Buscar</button>
  </form>
  <table>
    <thead><tr><th>Nombre</th><th>Precio (COP)</th><th>Cantidad</th></tr></thead>
    <tbody>
    {% for p in productos %}
      <tr><td>{{ p.nombre }}</td><td>{{ "{:,.0f}".format(p.precio) }}</td><td>{{ p.cantidad }}</td></tr>
    {% else %}
      <tr><td colspan="3" class="vacio">No hay productos para mostrar.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
